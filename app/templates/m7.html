{% extends "base.html" %}
{% block content %}
<section class="kpis">
  <div class="kpi"><b>契约</b><strong>CHAIN-2</strong><small>整链</small></div>
  <div class="kpi"><b>已签收</b><strong>1</strong><small>包</small></div>
  <div class="kpi"><b>拒签</b><strong>1</strong><small>包</small></div>
  <div class="kpi"><b>回执</b><strong>逐字节</strong><small>重传</small></div>
</section>
<div class="grid grid--split">
  <section class="panel">
    <div class="panel__head"><h2>航链交付</h2><span class="state state--ok">整链验收</span></div>
    <div class="panel__body panel__body--scroll">
      <table class="ledger"><thead><tr><th>序号</th><th>交付号</th><th>状态</th><th class="num">值</th></tr></thead>
      <tbody>{% for row in rows %}<tr><td class="num">{{ loop.index }}</td><td>{{ row.key }}</td><td>{{ row.status }}</td><td class="num">{{ row.value }}</td></tr>{% endfor %}</tbody></table>
    </div>
  </section>
  <section class="panel panel--evidence">
    <div class="panel__head"><h2>回执</h2><span class="panel__meta">留存</span></div>
    <div class="panel__body"><div class="evidence"><b>DLV-DEMO</b><span>CHAIN-2</span><code>/api/delivery/sign</code></div><pre id="result">等待运行</pre></div>
  </section>
  <section class="panel panel--status">
    <div class="panel__head"><h2>拒签原因</h2><span class="panel__meta">缺段</span></div>
    <div class="panel__body"><div class="bar"><i style="width:60%"></i></div><div class="legend"><span>MISSING_SEGMENT</span><span>CHAIN_TIME_CONFLICT</span></div></div>
  </section>
</div>
{% endblock %}
